<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F2937">
<meta name="robots" content="noindex">
<title>Pengguna — StockFlow</title>
<link rel="stylesheet" href="css/app.css?v=20261106b">
<style>
.code-pill {
  font-family: var(--ff-num); font-weight: 700; letter-spacing: .12em;
  background: var(--surface-2); border: 1px solid var(--border);
  padding: 3px 8px; border-radius: 6px; font-size: 13px;
}
.code-big {
  font-family: var(--ff-num); font-weight: 700; font-size: 30px; letter-spacing: .16em;
  text-align: center; padding: 16px; border-radius: 12px;
  background: var(--surface-2); border: 1px dashed var(--border-mid); user-select: all;
}
</style>
</head>
<body>
<div id="app">
<div class="content">

  <div class="row mb16">
    <div class="c-mid fs13">Karyawan masuk dengan <strong>username + kode unik</strong>, tanpa email.</div>
    <div class="spacer"></div>
    <button class="btn btn-primary" onclick="openAdd()">+ Tambah Karyawan</button>
  </div>

  <div class="card p0">
    <div class="table-wrap">
      <table class="tbl">
        <thead><tr>
          <th style="width:48px"></th>
          <th>Nama</th>
          <th>Username</th>
          <th>Kode</th>
          <th>Status</th>
          <th style="width:150px"></th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>

</div>
</div>

<!-- TAMBAH -->
<div class="modal" id="mAdd">
  <div class="modal-box narrow">
    <div class="modal-hd">
      <h3>Tambah Karyawan</h3>
      <button class="modal-x" onclick="UI.closeModal('mAdd')">&times;</button>
    </div>
    <div class="modal-bd">
      <div class="field">
        <label class="label" for="aName">NAMA</label>
        <input type="text" id="aName" class="input" placeholder="Nama karyawan">
      </div>
      <div class="field mb0">
        <label class="label" for="aUser">USERNAME</label>
        <input type="text" id="aUser" class="input" placeholder="misal: budi"
               autocapitalize="none" spellcheck="false" autocomplete="off">
        <div class="hint">Huruf kecil, angka, titik atau strip. 3–24 karakter.</div>
      </div>
    </div>
    <div class="modal-ft">
      <button class="btn" onclick="UI.closeModal('mAdd')">Batal</button>
      <button class="btn btn-primary" onclick="create()" id="addBtn">Buat</button>
    </div>
  </div>
</div>

<!-- KODE BARU -->
<div class="modal" id="mCode">
  <div class="modal-box narrow">
    <div class="modal-hd">
      <h3>Kode masuk</h3>
      <button class="modal-x" onclick="UI.closeModal('mCode')">&times;</button>
    </div>
    <div class="modal-bd">
      <div class="fs13 c-mid mb8">Username</div>
      <div class="fw7 mb16" id="cUser">&mdash;</div>
      <div class="fs13 c-mid mb8">Kode unik</div>
      <div class="code-big" id="cCode">&mdash;</div>
      <div class="hint mt12">Berikan ke karyawan. Kode bisa dilihat lagi di daftar ini.</div>
    </div>
    <div class="modal-ft">
      <button class="btn" onclick="copyCode()">Salin</button>
      <button class="btn btn-primary" onclick="UI.closeModal('mCode')">Selesai</button>
    </div>
  </div>
</div>

<script src="js/icons.js?v=20261106b"></script>
<script src="js/config.js?v=20261106b"></script>
<script src="js/demo.js?v=20261106b"></script>
<script src="js/api.js?v=20261106b"></script>
<script src="js/auth.js?v=20261106b"></script>
<script src="js/ui.js?v=20261106b"></script>
<script>
if (!Auth.guard(true)) throw 'redirect';
var U = Auth.user();
var people = [], codes = {};

UI.shell('users', 'Pengguna');

async function load() {
  UI.loading(true);
  var r = await API.from('profiles').select('id,name,username,role,active,created_at').order('created_at');
  var c = await API.from('staff_codes').select('profile_id,username,code');
  UI.loading(false);

  if (r.error) return UI.toast(r.error.message, 'error');
  people = r.data || [];
  codes = {};
  (c.data || []).forEach(function (x) { codes[x.profile_id] = x; });
  render();
}

function render() {
  var host = document.getElementById('rows');
  if (!people.length) {
    host.innerHTML = '<tr><td colspan="6">' + UI.empty('users', 'Belum ada karyawan') + '</td></tr>';
    return;
  }
  host.innerHTML = people.map(function (p) {
    var me = p.id === U.id;
    var owner = p.role === 'owner';
    var sc = codes[p.id];
    var actions = owner ? '' :
      '<button class="btn btn-sm btn-ghost" onclick="toggle(\'' + p.id + '\')">' + (p.active ? 'Nonaktifkan' : 'Aktifkan') + '</button>' +
      '<button class="btn btn-sm btn-ghost" title="Kode baru" onclick="regen(\'' + p.id + '\')">' + UI.ic('refresh', 15) + '</button>' +
      '<button class="btn btn-sm btn-ghost c-danger" title="Hapus" onclick="del(\'' + p.id + '\')">' + UI.ic('trash', 15) + '</button>';
    return '<tr>' +
      '<td><div class="sb-avatar" style="width:34px;height:34px;font-size:12px">' + UI.initials(p.name) + '</div></td>' +
      '<td><div class="fw6">' + UI.esc(p.name) + (me ? ' <span class="c-dim fs12">(Anda)</span>' : '') + '</div>' +
        '<div class="fs12 c-dim">' + (owner ? 'Owner' : 'Staff') + '</div></td>' +
      '<td class="mono fs13">' + UI.esc(sc ? sc.username : (p.username || '—')) + '</td>' +
      '<td>' + (sc ? '<span class="code-pill">' + UI.esc(sc.code) + '</span>' : '<span class="c-dim">—</span>') + '</td>' +
      '<td>' + (p.active ? '<span class="badge ok">Aktif</span>' : '<span class="badge">Nonaktif</span>') + '</td>' +
      '<td class="tr" style="white-space:nowrap">' + actions + '</td>' +
    '</tr>';
  }).join('');
}

function openAdd() {
  document.getElementById('aName').value = '';
  document.getElementById('aUser').value = '';
  UI.openModal('mAdd');
}

/* Username dirapikan sambil mengetik */
document.getElementById('aUser').addEventListener('input', function (e) {
  e.target.value = e.target.value.toLowerCase().replace(/[^a-z0-9._-]/g, '').slice(0, 24);
});

function showCode(username, code) {
  document.getElementById('cUser').textContent = username;
  document.getElementById('cCode').textContent = code;
  UI.openModal('mCode');
}

function copyCode() {
  var t = document.getElementById('cCode').textContent;
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(function () { UI.toast('Kode disalin', 'ok'); });
}

async function create() {
  var name = document.getElementById('aName').value.trim();
  var user = document.getElementById('aUser').value.trim();
  if (!name) return UI.toast('Isi nama', 'error');
  if (!/^[a-z0-9._-]{3,24}$/.test(user)) return UI.toast('Username 3–24 karakter', 'error');

  var btn = document.getElementById('addBtn');
  btn.disabled = true; UI.loading(true);
  var r = await API.invoke('create-staff', { action: 'create', name: name, username: user });
  UI.loading(false); btn.disabled = false;
  if (r.error) return UI.toast(r.error.message, 'error');

  UI.closeModal('mAdd');
  showCode(r.data.username, r.data.code);
  load();
}

async function toggle(id) {
  var p = people.find(function (x) { return x.id === id; });
  UI.loading(true);
  var r = await API.invoke('create-staff', { action: 'update', user_id: id, active: !p.active });
  UI.loading(false);
  if (r.error) return UI.toast(r.error.message, 'error');
  UI.toast(p.active ? 'Dinonaktifkan' : 'Diaktifkan', 'ok');
  load();
}

function regen(id) {
  var p = people.find(function (x) { return x.id === id; });
  UI.confirm({ title: 'Buat kode baru?', text: 'Kode lama ' + p.name + ' tidak bisa dipakai lagi.', ok: 'Buat kode baru' })
    .then(async function (ok) {
      if (!ok) return;
      UI.loading(true);
      var r = await API.invoke('create-staff', { action: 'update', user_id: id, regen_code: true });
      UI.loading(false);
      if (r.error) return UI.toast(r.error.message, 'error');
      showCode((codes[id] && codes[id].username) || p.username || '', r.data.code);
      load();
    });
}

function del(id) {
  var p = people.find(function (x) { return x.id === id; });
  UI.confirm({ title: 'Hapus karyawan?', text: p.name + ' tidak bisa masuk lagi. Riwayat transaksinya tetap tersimpan.', ok: 'Hapus', danger: true })
    .then(async function (ok) {
      if (!ok) return;
      UI.loading(true);
      var r = await API.invoke('create-staff', { action: 'delete', user_id: id });
      UI.loading(false);
      if (r.error) return UI.toast(r.error.message, 'error');
      UI.toast('Karyawan dihapus', 'ok');
      load();
    });
}

load();
</script>
</body>
</html>
