<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6C4CF1">
<title>Barang Rusak — StockFlow</title>
<link rel="stylesheet" href="css/app.css?v=20261106b">
</head>
<body>

<div id="app">
<div class="content">

  <div class="grid g3 mb16" id="stats"></div>

  <div class="card p0">
    <div class="card-hd">
      <h3>Catatan Barang Rusak</h3>
      <div class="spacer"></div>
      <select class="select" id="fRange" onchange="render()" style="width:auto">
        <option value="month">Bulan ini</option>
        <option value="week">7 hari</option>
        <option value="year">Tahun ini</option>
        <option value="all">Semua</option>
      </select>
      <button class="btn btn-primary" onclick="openAdd()">+ Catat</button>
    </div>
    <div class="table-wrap">
      <table class="tbl">
        <thead><tr>
          <th>Waktu</th>
          <th>Produk</th>
          <th class="num">Jumlah</th>
          <th class="num hide-mobile owner-col">Kerugian</th>
          <th class="hide-mobile">Alasan</th>
          <th>Bukti</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>

</div>
</div>

<!-- MODAL -->
<div class="modal" id="mAdd">
  <div class="modal-box">
    <div class="modal-hd">
      <h3>Catat Barang Rusak</h3>
      <button class="modal-x" onclick="UI.closeModal('mAdd')">&times;</button>
    </div>
    <div class="modal-bd">
      <div class="field">
        <label class="label">PRODUK *</label>
        <select id="aProd" class="select" onchange="onProd()"></select>
      </div>

      <div id="curStock" class="mb16 hide" style="background:var(--surface-2);border-radius:var(--r);padding:12px;font-size:13.5px"></div>

      <div class="field">
        <label class="label">JUMLAH RUSAK *</label>
        <input type="number" id="aQty" class="input" placeholder="0" min="1" step="any" oninput="preview()">
      </div>

      <div class="field">
        <label class="label">ALASAN *</label>
        <select id="aReason" class="select">
          <option>Kedaluwarsa</option>
          <option>Pecah / Rusak fisik</option>
          <option>Cacat produksi</option>
          <option>Basah / Lembab</option>
          <option>Hilang</option>
          <option>Lainnya</option>
        </select>
      </div>

      <div class="field">
        <label class="label">CATATAN TAMBAHAN</label>
        <input type="text" id="aNote" class="input" placeholder="Opsional">
      </div>
      <div class="field">
        <label class="label" id="evLbl">FOTO BUKTI</label>
        <input type="file" id="aEv" accept="image/*" capture="environment" class="hide" onchange="pickEv(this)">
        <div class="row" style="gap:12px;align-items:center">
          <div id="evPrev" style="width:84px;height:84px;border-radius:10px;border:1px dashed var(--border-mid);background:var(--surface-2);display:grid;place-items:center;overflow:hidden;flex:none">
            <span data-ico="camera" data-ico-size="20" class="c-dim"></span>
          </div>
          <button type="button" class="btn btn-sm" onclick="document.getElementById('aEv').click()">Ambil / pilih foto</button>
        </div>
      </div>

      <div id="lossBox" class="hide" style="background:var(--danger-faint);border-radius:var(--r);padding:14px;text-align:center">
        <div class="fs12 c-mid fw7">ESTIMASI KERUGIAN</div>
        <div class="fs22 fw8 c-danger mono" id="lossVal">Rp 0</div>
      </div>
    </div>
    <div class="modal-ft">
      <button class="btn" onclick="UI.closeModal('mAdd')">Batal</button>
      <button class="btn btn-danger" onclick="save()">Catat &amp; Kurangi Stok</button>
    </div>
  </div>
</div>

<script src="js/icons.js?v=20261106b"></script>
<script src="js/config.js?v=20261106b"></script>
<script src="js/demo.js?v=20261106b"></script>
<script src="js/api.js?v=20261106b"></script>
<script src="js/auth.js?v=20261106b"></script>
<script src="js/ui.js?v=20261106b"></script>
<script>
if (!Auth.guard()) throw 'redirect';
var U = Auth.user();
var products = [], rows = [];
var isOwner = U.role === 'owner';
var evFile = null;

UI.shell('damaged', 'Barang Rusak');

async function load() {
  UI.loading(true);
  var rp_ = await API.from('products').select('*').order('name');
  var rm = await API.from('stock_movements').select('*')
            .eq('type', 'damaged')
            .order('created_at', false).limit(300);
  UI.loading(false);

  products = rp_.data || [];
  rows     = rm.data || [];

  document.getElementById('aProd').innerHTML =
    '<option value="">— Pilih produk —</option>' +
    products.map(function (p) {
      return '<option value="' + p.id + '">' + UI.esc(p.name) + ' (stok ' + UI.num(p.stock) + ')</option>';
    }).join('');

  render();
}

function prod(id) { return products.find(function (x) { return x.id === id; }); }
function pName(id) { var p = prod(id); return p ? p.name : '(produk dihapus)'; }
function loss(m) { var p = prod(m.product_id); return (p ? Number(p.cost || 0) : 0) * Number(m.qty || 0); }

function render() {
  var key = document.getElementById('fRange').value;
  var r = UI.range(key);
  var list = rows.filter(function (m) {
    var d = new Date(m.created_at);
    return d >= r[0] && d < r[1];
  });

  if (!isOwner) document.querySelectorAll('.owner-col').forEach(function (e) { e.classList.add('hide'); });
  var totQty = list.reduce(function (s, m) { return s + Number(m.qty || 0); }, 0);
  var totLoss = list.reduce(function (s, m) { return s + loss(m); }, 0);

  document.getElementById('stats').innerHTML =
    '<div class="stat"><div class="stat-lbl">Kejadian</div><div class="stat-val">' + list.length + '</div></div>' +
    '<div class="stat"><div class="stat-lbl">Total Unit Rusak</div><div class="stat-val c-warn">' + UI.num(totQty) + '</div></div>' +
    (isOwner ? '<div class="stat"><div class="stat-lbl">Estimasi Kerugian</div><div class="stat-val c-danger" style="font-size:19px">' + UI.rp(totLoss) + '</div></div>' : '');

  if (!list.length) {
    document.getElementById('rows').innerHTML =
      '<tr><td colspan="6">' + UI.empty('check', 'Tidak ada barang rusak', 'Bagus! Tidak ada kerugian pada periode ini') + '</td></tr>';
    return;
  }

  document.getElementById('rows').innerHTML = list.map(function (m) {
    return '<tr>' +
      '<td class="c-mid fs13 nowrap">' + UI.dt(m.created_at) + '</td>' +
      '<td class="fw7">' + UI.esc(pName(m.product_id)) + '</td>' +
      '<td class="num fw7 mono c-danger">-' + UI.num(m.qty) + '</td>' +
      (isOwner ? '<td class="num hide-mobile mono">' + UI.rp(loss(m)) + '</td>' : '') +
      '<td class="hide-mobile c-dim fs13">' + UI.esc(m.note || '—') + '</td>' +
      '<td>' + (m.evidence_url
        ? '<a href="' + UI.esc(m.evidence_url) + '" target="_blank" rel="noopener"><img src="' + UI.esc(m.evidence_url) +
          '" alt="Bukti" style="width:42px;height:42px;object-fit:cover;border-radius:6px;border:1px solid var(--border)"></a>'
        : '<span class="c-dim">—</span>') + '</td>' +
      '</tr>';
  }).join('');
}

/* ---------- Form ---------- */
function openAdd() {
  document.getElementById('aProd').value = '';
  document.getElementById('aQty').value = '';
  document.getElementById('aNote').value = '';
  document.getElementById('aEv').value = '';
  evFile = null;
  document.getElementById('evPrev').innerHTML = UI.ic('camera', 20);
  document.getElementById('evLbl').textContent = isOwner ? 'FOTO BUKTI (opsional)' : 'FOTO BUKTI *';
  document.getElementById('curStock').classList.add('hide');
  document.getElementById('lossBox').classList.add('hide');
  UI.openModal('mAdd');
}

function onProd() {
  var p = prod(document.getElementById('aProd').value);
  var box = document.getElementById('curStock');
  if (!p) { box.classList.add('hide'); return; }
  box.classList.remove('hide');
  box.innerHTML = '<div class="row"><span class="c-mid">Stok saat ini</span><div class="spacer"></div>' +
    '<strong class="mono">' + UI.num(p.stock) + ' ' + UI.esc(p.unit || 'pcs') + '</strong></div>';
  preview();
}

function pickEv(inp) {
  var f = inp.files && inp.files[0];
  if (!f) return;
  if (f.size > 8 * 1024 * 1024) return UI.toast('Foto maksimal 8MB', 'error');
  evFile = f;
  var r = new FileReader();
  r.onload = function (e) {
    document.getElementById('evPrev').innerHTML =
      '<img src="' + e.target.result + '" alt="" style="width:100%;height:100%;object-fit:cover">';
  };
  r.readAsDataURL(f);
}

function preview() {
  var p = prod(document.getElementById('aProd').value);
  var q = Number(document.getElementById('aQty').value) || 0;
  var box = document.getElementById('lossBox');
  if (!isOwner) { box.classList.add('hide'); return; }
  if (!p || !q) { box.classList.add('hide'); return; }
  box.classList.remove('hide');
  document.getElementById('lossVal').textContent = UI.rp(Number(p.cost || 0) * q);
}

async function save() {
  var pid = document.getElementById('aProd').value;
  var q   = Number(document.getElementById('aQty').value) || 0;

  if (!pid) return UI.toast('Pilih produk dulu', 'error');
  if (q <= 0) return UI.toast('Jumlah harus lebih dari 0', 'error');

  var p = prod(pid);
  var cur = Number(p.stock) || 0;
  if (q > cur) return UI.toast('Stok tidak cukup (tersedia ' + UI.num(cur) + ')', 'error');

  var reason = document.getElementById('aReason').value;
  var extra  = document.getElementById('aNote').value.trim();
  var note   = reason + (extra ? ' — ' + extra : '');

  if (!isOwner && !evFile) return UI.toast('Foto bukti wajib untuk staff', 'error');

  UI.loading(true);

  var evUrl = null;
  if (evFile) {
    evUrl = await API.upload(evFile, 'evidence/' + U.business_id);
    if (!evUrl) { UI.loading(false); return UI.toast(API.uploadError || 'Gagal mengunggah foto', 'error'); }
  }

  var r = await API.rpc('record_damage', {
    p_product_id: pid, p_qty: q, p_note: note, p_evidence: evUrl,
  });
  if (r.error) { UI.loading(false); return UI.toast(r.error.message, 'error'); }

  UI.loading(false);
  UI.toast('Dicatat, stok dikurangi', 'ok');
  UI.closeModal('mAdd');
  load();
}

load();
</script>
</body>
</html>
