<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6C4CF1">
<title>Produk — StockFlow</title>
<link rel="stylesheet" href="css/app.css?v=20261105b">
</head>
<body>

<div id="app">
<div class="content">

  <div class="row wrap mb16">
    <div class="search-wrap" style="max-width:380px">
      <input type="text" id="q" class="input" placeholder="Cari produk…" oninput="render()">
    </div>
    <select class="select" id="fCat" onchange="render()" style="width:auto;min-width:150px"></select>
    <div class="spacer"></div>
    <button class="btn" onclick="openCat()"><span data-ico="tag" data-ico-size="16"></span>Kategori</button>
    <button class="btn btn-primary" onclick="openEdit()">+ Produk</button>
  </div>

  <div class="grid g4 keep mb16" id="stats"></div>

  <div class="card p0">
    <div class="table-wrap">
      <table class="tbl">
        <thead><tr>
          <th style="width:46px"></th>
          <th>Produk</th>
          <th class="hide-mobile">Kategori</th>
          <th class="num">Harga</th>
          <th class="num">Stok</th>
          <th style="width:90px"></th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>

</div>
</div>

<!-- MODAL PRODUK -->
<div class="modal" id="mEdit">
  <div class="modal-box wide">
    <div class="modal-hd">
      <h3 id="eTitle">Tambah Produk</h3>
      <button class="modal-x" onclick="UI.closeModal('mEdit')">&times;</button>
    </div>
    <div class="modal-bd">
      <input type="hidden" id="eId">

      <div class="field tc">
        <div id="imgPrev" style="width:120px;height:120px;border-radius:var(--r-lg);background:var(--surface-2);margin:0 auto 10px;display:grid;place-items:center;font-size:36px;overflow:hidden;border:1.5px solid var(--border)"><span data-ico="box" data-ico-size="16"></span></div>
        <input type="file" id="eImg" accept="image/*" class="hide" onchange="pickImg(this)">
        <button class="btn btn-sm" onclick="document.getElementById('eImg').click()"><span data-ico="camera" data-ico-size="16"></span>Pilih Foto</button>
        <button class="btn btn-sm btn-ghost hide" id="imgDel" onclick="delImg()">Hapus</button>
      </div>

      <div class="field">
        <label class="label">NAMA PRODUK *</label>
        <input type="text" id="eName" class="input" placeholder="Misal: Kopi Susu">
      </div>

      <div class="grid g2">
        <div class="field">
          <label class="label">KATEGORI</label>
          <select id="eCat" class="select"></select>
        </div>
        <div class="field">
          <label class="label">SATUAN</label>
          <input type="text" id="eUnit" class="input" placeholder="pcs" value="pcs">
        </div>
      </div>

      <div class="grid g2">
        <div class="field">
          <label class="label">HARGA JUAL *</label>
          <input type="number" id="ePrice" class="input" placeholder="0" min="0">
        </div>
        <div class="field">
          <label class="label">HARGA BELI</label>
          <input type="number" id="eCost" class="input" placeholder="0" min="0">
          <div class="hint">Untuk menghitung laba.</div>
        </div>
      </div>

      <div class="grid g2">
        <div class="field">
          <label class="label">STOK AWAL</label>
          <input type="number" id="eStock" class="input" placeholder="0" min="0">
        </div>
        <div class="field">
          <label class="label">STOK MINIMUM</label>
          <input type="number" id="eMin" class="input" placeholder="0" min="0">
          <div class="hint">Peringatan bila stok di bawah ini.</div>
        </div>
      </div>

    </div>
    <div class="modal-ft">
      <button class="btn" onclick="UI.closeModal('mEdit')">Batal</button>
      <button class="btn btn-primary" onclick="save()">Simpan</button>
    </div>
  </div>
</div>

<!-- MODAL KATEGORI -->
<div class="modal" id="mCat">
  <div class="modal-box narrow">
    <div class="modal-hd">
      <h3>Kategori</h3>
      <button class="modal-x" onclick="UI.closeModal('mCat')">&times;</button>
    </div>
    <div class="modal-bd">
      <div class="row mb16">
        <input type="text" id="cName" class="input" placeholder="Nama kategori baru">
        <button class="btn btn-primary" onclick="addCat()">Tambah</button>
      </div>
      <div id="catList"></div>
    </div>
  </div>
</div>

<script src="js/icons.js?v=20261105b"></script>
<script src="js/config.js?v=20261105b"></script>
<script src="js/demo.js?v=20261105b"></script>
<script src="js/demo.js?v=20261105b"></script>
<script src="js/api.js?v=20261105b"></script>
<script src="js/auth.js?v=20261105b"></script>
<script src="js/ui.js?v=20261105b"></script>
<script>
if (!Auth.guard()) throw 'redirect';
var U = Auth.user();
var products = [], cats = [], imgUrl = null, imgFile = null;

UI.shell('products', 'Produk');

async function load() {
  UI.loading(true);
  var rc = await API.from('categories').select('*').order('sort_order');
  var rp_ = await API.from('products').select('*').order('name');
  UI.loading(false);

  if (rp_.error) return UI.toast(rp_.error.message, 'error');
  cats = rc.data || [];
  products = rp_.data || [];

  var opts = '<option value="">— Tanpa kategori —</option>' +
    cats.map(function (c) { return '<option value="' + c.id + '">' + UI.esc(c.name) + '</option>'; }).join('');
  document.getElementById('eCat').innerHTML = opts;
  document.getElementById('fCat').innerHTML = '<option value="">Semua kategori</option>' +
    cats.map(function (c) { return '<option value="' + c.id + '">' + UI.esc(c.name) + '</option>'; }).join('');

  render();
  renderStats();
}

function catName(id) {
  var c = cats.find(function (x) { return x.id === id; });
  return c ? c.name : '—';
}

function renderStats() {
  var total = products.length;
  var low = products.filter(function (p) { return Number(p.stock) > 0 && Number(p.stock) <= Number(p.min_stock || 0); }).length;
  var out = products.filter(function (p) { return Number(p.stock) <= 0; }).length;
  var val = products.reduce(function (s, p) { return s + Number(p.cost || 0) * Number(p.stock || 0); }, 0);

  document.getElementById('stats').innerHTML =
    '<div class="stat"><div class="stat-lbl">Total Produk</div><div class="stat-val">' + total + '</div></div>' +
    '<div class="stat"><div class="stat-lbl">Stok Rendah</div><div class="stat-val c-warn">' + low + '</div></div>' +
    '<div class="stat"><div class="stat-lbl">Stok Habis</div><div class="stat-val c-danger">' + out + '</div></div>' +
    '<div class="stat"><div class="stat-lbl">Nilai Inventori</div><div class="stat-val" style="font-size:19px">' + UI.rp(val) + '</div></div>';
}

function render() {
  var q = document.getElementById('q').value.toLowerCase().trim();
  var fc = document.getElementById('fCat').value;

  var list = products.filter(function (p) {
    if (fc && p.category_id !== fc) return false;
    if (!q) return true;
    return (p.name || '').toLowerCase().includes(q) ||
           (p.sku || '').toLowerCase().includes(q) ||
           (p.barcode || '').toLowerCase().includes(q);
  });

  if (!list.length) {
    document.getElementById('rows').innerHTML =
      '<tr><td colspan="7">' +
      products.length
        ? UI.empty('search', 'Tidak ada hasil', 'Coba kata kunci atau kategori lain')
        : UI.empty('box', 'Belum ada produk', 'Mulai dengan satu produk yang paling sering Anda jual.', { label: 'Tambah produk pertama', onclick: 'openEdit()' }) +
      '</td></tr>';
    return;
  }

  document.getElementById('rows').innerHTML = list.map(function (p) {
    var st = Number(p.stock) || 0;
    var cls = st <= 0 ? 'danger' : (st <= Number(p.min_stock || 0) ? 'warn' : 'ok');
    return '<tr>' +
      '<td><div style="width:38px;height:38px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;overflow:hidden;font-size:17px">' +
        (p.image_url ? '<img src="' + UI.esc(p.image_url) + '" style="width:100%;height:100%;object-fit:cover" loading="lazy">' : UI.ic('box', 22)) +
      '</div></td>' +
      '<td><div class="fw7">' + UI.esc(p.name) + '</div>' +
        (p.active ? '' : '<span class="badge">Nonaktif</span>') + '</td>' +
      '<td class="hide-mobile c-mid">' + UI.esc(catName(p.category_id)) + '</td>' +
      '<td class="num fw7 mono">' + UI.rp(p.price) + '</td>' +
      '<td class="num"><span class="badge ' + cls + '">' + UI.num(st) + '</span></td>' +
      '<td><div class="row" style="gap:4px;justify-content:flex-end">' +
        '<button class="btn btn-ghost btn-icon" onclick="openEdit(\'' + p.id + '\')" title="Ubah">&#9999;</button>' +
        '<button class="btn btn-ghost btn-icon c-danger" onclick="del(\'' + p.id + '\')" title="Hapus">' + UI.ic('trash',16) + '</button>' +
      '</div></td></tr>';
  }).join('');
}

/* ---------- Form ---------- */
function openEdit(id) {
  imgFile = null;
  var p = id ? products.find(function (x) { return x.id === id; }) : null;

  document.getElementById('eTitle').textContent = p ? 'Ubah Produk' : 'Tambah Produk';
  document.getElementById('eId').value    = p ? p.id : '';
  document.getElementById('eName').value  = p ? p.name : '';
  document.getElementById('eCat').value   = p && p.category_id ? p.category_id : '';
  document.getElementById('eUnit').value  = p ? (p.unit || 'pcs') : 'pcs';
  document.getElementById('ePrice').value = p ? p.price : '';
  document.getElementById('eCost').value  = p ? p.cost : '';
  document.getElementById('eStock').value = p ? p.stock : '';
  document.getElementById('eMin').value   = p ? p.min_stock : '';

  imgUrl = p ? p.image_url : null;
  showPrev();
  document.getElementById('eStock').disabled = !!p;
  UI.openModal('mEdit');
}

function showPrev() {
  document.getElementById('imgPrev').innerHTML = imgUrl
    ? '<img src="' + UI.esc(imgUrl) + '" style="width:100%;height:100%;object-fit:cover">'
    : UI.ic('box', 26);
  document.getElementById('imgDel').classList.toggle('hide', !imgUrl);
}

function pickImg(inp) {
  var f = inp.files && inp.files[0];
  if (!f) return;
  if (f.size > 5 * 1024 * 1024) return UI.toast('Foto maksimal 5MB', 'error');
  imgFile = f;
  var r = new FileReader();
  r.onload = function (e) { imgUrl = e.target.result; showPrev(); };
  r.readAsDataURL(f);
}

function delImg() { imgUrl = null; imgFile = null; document.getElementById('eImg').value = ''; showPrev(); }

async function save() {
  var name  = document.getElementById('eName').value.trim();
  var price = Number(document.getElementById('ePrice').value) || 0;
  if (!name)  return UI.toast('Nama produk wajib diisi', 'error');
  if (price <= 0) return UI.toast('Harga jual harus lebih dari 0', 'error');

  UI.loading(true);

  var url = imgUrl;
  if (imgFile) {
    url = await API.upload(imgFile, 'products/' + U.business_id);
    if (!url) { UI.loading(false); return UI.toast('Gagal mengunggah foto', 'error'); }
  }
  if (url && url.startsWith('data:')) url = null;

  var id = document.getElementById('eId').value;
  var body = {
    business_id: U.business_id,
    category_id: document.getElementById('eCat').value || null,
    name: name,
    unit: document.getElementById('eUnit').value.trim() || 'pcs',
    price: price,
    cost: Number(document.getElementById('eCost').value) || 0,
    min_stock: Number(document.getElementById('eMin').value) || 0,
    image_url: url,
  };

  var res;
  if (id) {
    res = await API.from('products').update(body).eq('id', id).run();
  } else {
    body.stock = Number(document.getElementById('eStock').value) || 0;
    res = await API.from('products').insert(body).select('*').single();

    /* Catat stok awal sebagai pergerakan stok masuk */
    if (!res.error && body.stock > 0) {
      await API.from('stock_movements').insert({
        business_id: U.business_id, product_id: res.data.id, type: 'in',
        qty: body.stock, cost: body.cost, note: 'Stok awal', user_id: U.id,
      }).select('id');
    }
  }

  UI.loading(false);
  if (res.error) return UI.toast(res.error.message, 'error');

  UI.toast(id ? 'Produk diperbarui' : 'Produk ditambahkan', 'ok');
  UI.closeModal('mEdit');
  load();
}

function del(id) {
  var p = products.find(function (x) { return x.id === id; });
  UI.confirm({
    title: 'Hapus produk?',
    text: '"' + (p ? p.name : '') + '" akan dihapus permanen beserta riwayat stoknya.',
    ok: 'Hapus', danger: true,
  }).then(async function (ok) {
    if (!ok) return;
    UI.loading(true);
    var r = await API.from('products').remove().eq('id', id).run();
    UI.loading(false);
    if (r.error) return UI.toast(r.error.message, 'error');
    UI.toast('Produk dihapus', 'ok');
    load();
  });
}

/* ---------- Kategori ---------- */
function openCat() { renderCatList(); UI.openModal('mCat'); }

function renderCatList() {
  document.getElementById('catList').innerHTML = cats.length
    ? cats.map(function (c) {
        var n = products.filter(function (p) { return p.category_id === c.id; }).length;
        return '<div class="row" style="padding:11px;border-radius:var(--r);background:var(--surface-2);margin-bottom:8px">' +
          '<div style="flex:1"><div class="fw7">' + UI.esc(c.name) + '</div>' +
          '<div class="fs12 c-dim">' + n + ' produk</div></div>' +
          '<button class="btn btn-ghost btn-icon c-danger" onclick="delCat(\'' + c.id + '\')">' + UI.ic('trash',16) + '</button></div>';
      }).join('')
    : '<p class="c-dim tc fs13" style="padding:16px 0">Belum ada kategori.</p>';
}

async function addCat() {
  var name = document.getElementById('cName').value.trim();
  if (!name) return UI.toast('Isi nama kategori', 'error');

  UI.loading(true);
  var r = await API.from('categories').insert({
    business_id: U.business_id, name: name, sort_order: cats.length + 1,
  }).select('*').single();
  UI.loading(false);

  if (r.error) return UI.toast(r.error.message, 'error');
  document.getElementById('cName').value = '';
  UI.toast('Kategori ditambahkan', 'ok');
  await load();
  renderCatList();
}

function delCat(id) {
  UI.confirm({ title: 'Hapus kategori?', text: 'Produk di dalamnya tidak terhapus, hanya kategorinya dikosongkan.', ok: 'Hapus', danger: true })
    .then(async function (ok) {
      if (!ok) return;
      UI.loading(true);
      await API.from('categories').remove().eq('id', id).run();
      UI.loading(false);
      await load();
      renderCatList();
    });
}

load();
</script>
</body>
</html>
