<style>
.rp-top .chips { flex-wrap: wrap; }
.rp-hero {
  border-radius: 16px; padding: 22px 24px; color: #fff;
  background: linear-gradient(135deg, #1F2937 0%, #312E81 60%, #6D28D9 100%);
  display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: center;
}
.rp-hero .lbl { font-size: 13px; opacity: .75; font-weight: 600; letter-spacing: .02em; }
.rp-hero .big { font-size: clamp(30px, 5vw, 42px); font-weight: 750; letter-spacing: -.03em; line-height: 1.1; margin: 4px 0 8px; }
.rp-hero .say { font-size: 14.5px; opacity: .9; line-height: 1.55; max-width: 60ch; }
.rp-hero .say b { color: #fff; }
.rp-delta { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 700;
            padding: 3px 9px; border-radius: 99px; background: rgba(255,255,255,.14); }
.rp-delta.up { color: #86EFAC; } .rp-delta.down { color: #FCA5A5; }
.rp-ring { width: 104px; height: 104px; }
@media (max-width: 620px) { .rp-hero { grid-template-columns: 1fr; } .rp-ring { display: none; } }

.rp-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
@media (max-width: 900px) { .rp-kpis { grid-template-columns: repeat(2, 1fr); } }
.rp-kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; }
.rp-kpi .k-l { font-size: 12.5px; color: var(--text-mid); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.rp-kpi .k-v { font-size: 21px; font-weight: 750; letter-spacing: -.02em; margin-top: 4px; }
.rp-kpi .k-s { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
.rp-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

.rp-grid { display: grid; grid-template-columns: 1.35fr 1fr; gap: 16px; }
@media (max-width: 900px) { .rp-grid { grid-template-columns: 1fr; } }
.rp-h { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
.rp-h h3 { font-size: 15.5px; font-weight: 700; flex: 1; }

.rp-chart { height: 230px; display: flex; flex-direction: column; }
.rp-bars { flex: 1; display: flex; align-items: flex-end; gap: 4px; border-bottom: 1px solid var(--border); position: relative; }
.rp-bar { flex: 1; min-width: 0; position: relative; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; }
.rp-bar i { display: block; border-radius: 5px 5px 0 0; background: linear-gradient(180deg, #8B5CF6, #6D28D9); min-height: 2px; transition: height .5s cubic-bezier(.2,.8,.2,1); }
.rp-bar.zero i { background: var(--border); }
.rp-bar.peak i { background: linear-gradient(180deg, #A78BFA, #7C3AED); box-shadow: 0 6px 14px rgba(124,58,237,.35); }
.rp-bar .tip { position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); white-space: nowrap;
               background: var(--ink); color: #fff; font-size: 11.5px; font-weight: 600; padding: 4px 8px; border-radius: 6px;
               opacity: 0; pointer-events: none; transition: opacity .12s; z-index: 2; }
.rp-bar:hover .tip { opacity: 1; }
.rp-bars { padding-top: 28px; }
.k-s.up { color: var(--ok); } .k-s.down { color: var(--danger); }
.rp-bar:hover i { filter: brightness(1.12); }
.rp-x { display: flex; gap: 4px; margin-top: 6px; }
.rp-x span { flex: 1; min-width: 0; text-align: center; font-size: 10.5px; color: var(--text-dim); overflow: hidden; white-space: nowrap; }

.rp-pl { display: flex; flex-direction: column; gap: 2px; }
.rp-pl .r { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px dashed var(--border); }
.rp-pl .r:last-child { border-bottom: 0; }
.rp-pl .op { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; font-weight: 800; font-size: 14px; }
.rp-pl .op.plus { background: rgba(4,120,87,.12); color: var(--ok); }
.rp-pl .op.min  { background: rgba(185,28,28,.10); color: var(--danger); }
.rp-pl .op.eq   { background: rgba(124,58,237,.14); color: #7C3AED; }
.rp-pl .t b { display: block; font-size: 14px; font-weight: 650; }
.rp-pl .t small { font-size: 12px; color: var(--text-dim); }
.rp-pl .v { font-weight: 700; font-family: var(--ff-num); font-size: 14px; }
.rp-pl .r.final { border-top: 2px solid var(--border); border-bottom: 0; margin-top: 4px; padding-top: 12px; }
.rp-pl .r.final .v { font-size: 18px; }

.rp-rank { display: flex; flex-direction: column; gap: 10px; }
.rp-rank .it { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center; }
.rp-rank .no { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-weight: 750; font-size: 12.5px;
               background: var(--surface-2); color: var(--text-mid); }
.rp-rank .it:nth-child(1) .no { background: #FEF3C7; color: #B45309; }
.rp-rank .it:nth-child(2) .no { background: #E5E7EB; color: #374151; }
.rp-rank .it:nth-child(3) .no { background: #FFEDD5; color: #C2410C; }
.rp-rank .nm { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rp-rank .meter { height: 6px; border-radius: 99px; background: var(--surface-2); margin-top: 5px; overflow: hidden; }
.rp-rank .meter i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #7C3AED, #2563EB); }
.rp-rank .val { text-align: right; font-size: 13px; }
.rp-rank .val b { display: block; font-family: var(--ff-num); }
.rp-rank .val small { color: var(--text-dim); }

.rp-split { display: flex; height: 12px; border-radius: 99px; overflow: hidden; background: var(--surface-2); margin-bottom: 10px; }
.rp-split i { display: block; height: 100%; }
.rp-legend { display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; }
.rp-legend .l { display: flex; align-items: center; gap: 8px; }
.rp-legend .l b { margin-left: auto; font-family: var(--ff-num); }

.rp-low { display: flex; flex-direction: column; gap: 8px; }
.rp-low .it { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.rp-low .it span:first-child { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 550; }
</style>
</head>
<body>

<div id="app">
<div class="content">

  <div class="row wrap mb16 rp-top">
    <div class="chips">
      <button class="chip on" data-r="today"     onclick="setRange('today')">Hari ini</button>
      <button class="chip"    data-r="yesterday" onclick="setRange('yesterday')">Kemarin</button>
      <button class="chip"    data-r="week"      onclick="setRange('week')">7 hari</button>
      <button class="chip"    data-r="month"     onclick="setRange('month')">Bulan ini</button>

    </div>
    <div class="spacer"></div>
    <button class="btn btn-sm" onclick="openExp()">+ Pengeluaran</button>
    <button class="btn btn-sm" onclick="exportCsv()"><span data-ico="download" data-ico-size="15"></span>CSV</button>
  </div>

  <!-- RINGKASAN UTAMA -->
  <div class="rp-hero mb16" id="hero"></div>

  <!-- 4 ANGKA PENTING -->
  <div class="rp-kpis mb16" id="kpi"></div>

  <div class="rp-grid mb16">
    <div class="card">
      <div class="rp-h"><h3>Penjualan</h3><span class="c-dim fs12" id="chartHint"></span></div>

    <div class="card">
      <div class="rp-h"><h3>Dari mana untungnya?</h3></div>

  </div>

  <div class="rp-grid">
    <div class="card">
      <div class="rp-h"><h3>Produk paling laku</h3></div>
      <div id="top"></div>
    </div>
    <div class="card">
      <div class="rp-h"><h3>Cara bayar</h3></div>
      <div id="pay" class="mb16"></div>
      <div class="rp-h" style="margin-top:6px"><h3>Stok hampir habis</h3></div>
      <div id="low"></div>
    </div>
  </div>

  <div class="card p0 mt16" id="shiftCard">
    <div class="card-hd"><h3>Riwayat buka / tutup kasir</h3></div>
    <div class="table-wrap"><table class="tbl">
      <thead><tr><th>Kasir</th><th>Waktu</th><th class="num">Tunai</th><th class="num">QRIS</th><th class="num">Seharusnya</th><th class="num">Di laci</th><th class="num">Selisih</th></tr></thead>
      <tbody id="shiftRows"></tbody>
    </table></div>

</div>

  <div class="modal-box">

<script src="js/icons.js?v=20261113c"></script>
<script src="js/config.js?v=20261113c"></script>
<script src="js/demo.js?v=20261113c"></script>

<script>
if (!Auth.guard(true)) throw 'redirect';
var U = Auth.user();
var orders = [], items = [], products = [], expenses = [], moves = [], refunds = [];
var curRange = 'today';

UI.shell('reports', 'Laporan');

async function load() {
  UI.loading(true);
  var a = await API.from('orders').select('*').eq('status', 'paid').order('created_at', false).limit(2000);
  var b = await API.from('products').select('*');
  var c = await API.from('expenses').select('*').order('created_at', false).limit(500);
  var d = await API.from('stock_movements').select('*').eq('type', 'damaged').limit(1000);
  var f = await API.from('refunds').select('*').order('created_at', false).limit(1000);
  refunds  = f.error ? [] : (f.data || []);
  var g = await API.from('shifts').select('*').order('opened_at', false).limit(30);
  renderShifts(g.error ? null : (g.data || []));
  UI.loading(false);

  orders   = a.data || [];
  products = b.data || [];
  expenses = c.data || [];
  moves    = d.data || [];

  /* Ambil item untuk order dalam rentang terluas yang mungkin dipakai */
  var ids = orders.slice(0, 500).map(function (o) { return '"' + o.id + '"'; });
  if (ids.length) {
    var e = await API.from('order_items').select('*').inList('order_id', ids).limit(5000);
    items = e.data || [];
  }
  render();
}

function setRange(k) {
  curRange = k;
  document.querySelectorAll('.chip[data-r]').forEach(function (b) {
    b.classList.toggle('on', b.dataset.r === k);
  });
  render();
}

function inRange(s) {
  var r = UI.range(curRange);
  var d = new Date(s);
  return d >= r[0] && d < r[1];
}

var LABEL = { today: 'hari ini', yesterday: 'kemarin', week: '7 hari terakhir', month: 'bulan ini', year: 'tahun ini' };
var PREV  = { today: 'kemarin', yesterday: 'hari sebelumnya', week: '7 hari sebelumnya', month: 'bulan lalu', year: 'tahun lalu' };

/* Periode pembanding dengan panjang yang sama, tepat sebelum periode ini */
function prevRange() {
  var r = UI.range(curRange);
  if (curRange === 'month') {
    var s = new Date(r[0]); s.setMonth(s.getMonth() - 1);
    var e = new Date(s); e.setDate(e.getDate() + Math.round((r[1] - r[0]) / 86400000));
    return [s, e];
  }
  if (curRange === 'year') {
    var ys = new Date(r[0]); ys.setFullYear(ys.getFullYear() - 1);
    var ye = new Date(r[1]); ye.setFullYear(ye.getFullYear() - 1);
    return [ys, ye];
  }
  var len = r[1] - r[0];
  return [new Date(r[0] - len), new Date(r[0])];
}

function between(s, r) { var d = new Date(s); return d >= r[0] && d < r[1]; }

function summarize(os, its, exp, dmg, rfs) {
  rfs = rfs || [];
  var refund  = rfs.reduce(function (s, r) { return s + Number(r.amount || 0); }, 0);
  var refCost = rfs.reduce(function (s, r) { return s + Number(r.cost || 0); }, 0);
  var rev  = os.reduce(function (s, o) { return s + Number(o.total || 0); }, 0) - refund;
  var hpp  = os.reduce(function (s, o) { return s + Number(o.cost_total || 0); }, 0) - refCost;
  var disc = os.reduce(function (s, o) { return s + Number(o.discount || 0); }, 0);
  var opex = exp.reduce(function (s, e) { return s + Number(e.amount || 0); }, 0);
  var loss = dmg.reduce(function (s, m) {
    var p = products.find(function (x) { return x.id === m.product_id; });
    return s + (p ? Number(p.cost || 0) : 0) * Number(m.qty || 0);
  }, 0);
  var qty = its.reduce(function (s, i) { return s + Number(i.qty || 0); }, 0);
  return { rev: rev, hpp: hpp, disc: disc, opex: opex, loss: loss, qty: qty, refund: refund,
           gross: rev - hpp, net: rev - hpp - opex - loss, n: os.length };
}

function delta(now, before) {
  if (!before) return now ? { pct: null, up: true } : null;
  var p = Math.round((now - before) / Math.abs(before) * 100);
  return { pct: p, up: p >= 0 };
}

function deltaHtml(d) {
  if (!d) return '';
  if (d.pct === null) return '<span class="rp-delta up">baru</span>';
  return '<span class="rp-delta ' + (d.up ? 'up' : 'down') + '">' + (d.up ? '▲' : '▼') + ' ' + Math.abs(d.pct) + '%</span>';
}

function render() {
  var r = UI.range(curRange), pr = prevRange();
  var os  = orders.filter(function (o) { return between(o.created_at, r); });
  var pos = orders.filter(function (o) { return between(o.created_at, pr); });
  var oid = {}; os.forEach(function (o) { oid[o.id] = true; });
  var its = items.filter(function (i) { return oid[i.order_id]; });

  var S = summarize(os, its,
    expenses.filter(function (e) { return between(e.created_at, r); }),
    moves.filter(function (m) { return between(m.created_at, r); }),
    refunds.filter(function (x) { return between(x.created_at, r); }));
  var P = summarize(pos, [],
    expenses.filter(function (e) { return between(e.created_at, pr); }),
    moves.filter(function (m) { return between(m.created_at, pr); }),
    refunds.filter(function (x) { return between(x.created_at, pr); }));

  var margin = S.rev ? Math.round(S.net / S.rev * 100) : 0;
  var dRev = delta(S.rev, P.rev);

  /* ---------- Ringkasan dalam kalimat ---------- */
  var say = S.n
    ? 'Ada <b>' + S.n + ' transaksi</b> ' + LABEL[curRange] + ', ' + UI.num(S.qty) + ' barang terjual. ' +
      'Setelah dikurangi modal dan biaya, <b>untung bersih ' + UI.rp(S.net) + '</b>' +
      (S.rev ? ' (' + margin + '% dari uang masuk)' : '') + '.' +
      (dRev && dRev.pct !== null ? ' Uang masuk ' + (dRev.up ? 'naik' : 'turun') + ' ' + Math.abs(dRev.pct) + '% dibanding ' + PREV[curRange] + '.' : '')
    : 'Belum ada transaksi ' + LABEL[curRange] + '.';

  var ringPct = Math.max(0, Math.min(100, margin));
  var C = 2 * Math.PI * 42;
  document.getElementById('hero').innerHTML =
    '<div>' +
      '<div class="lbl">UANG MASUK ' + LABEL[curRange].toUpperCase() + '</div>' +
      '<div class="big">' + UI.rp(S.rev) + '</div>' +
      '<div class="mb8">' + deltaHtml(dRev) + (dRev ? ' <span style="opacity:.7;font-size:12.5px">vs ' + PREV[curRange] + '</span>' : '') + '</div>' +
      '<div class="say">' + say + '</div>' +
    '</div>' +
    '<svg class="rp-ring" viewBox="0 0 100 100" aria-label="Margin untung ' + margin + '%">' +
      '<circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="10"/>' +
      '<circle cx="50" cy="50" r="42" fill="none" stroke="' + (S.net >= 0 ? '#86EFAC' : '#FCA5A5') + '" stroke-width="10" stroke-linecap="round" ' +
        'stroke-dasharray="' + (C * ringPct / 100).toFixed(1) + ' ' + C.toFixed(1) + '" transform="rotate(-90 50 50)"/>' +
      '<text x="50" y="48" text-anchor="middle" fill="#fff" font-size="20" font-weight="800">' + margin + '%</text>' +
      '<text x="50" y="64" text-anchor="middle" fill="rgba(255,255,255,.7)" font-size="9.5" font-weight="600">untung</text>' +
    '</svg>';

  /* ---------- 4 angka penting ---------- */
  var kpi = function (dot, label, val, sub, cls) {
    return '<div class="rp-kpi"><div class="k-l"><span class="rp-dot" style="background:' + dot + '"></span>' + label + '</div>' +
      '<div class="k-v ' + (cls || '') + '">' + val + '</div><div class="k-s' + (/^▲/.test(sub) ? ' up' : /^▼/.test(sub) ? ' down' : '') + '">' + sub + '</div></div>';
  };
  var dNet = delta(S.net, P.net), dN = delta(S.n, P.n);
  document.getElementById('kpi').innerHTML =
    kpi('#7C3AED', 'Untung bersih', UI.rp(S.net), dNet && dNet.pct !== null ? (dNet.up ? '▲ ' : '▼ ') + Math.abs(dNet.pct) + '% vs ' + PREV[curRange] : 'setelah semua biaya', S.net >= 0 ? 'c-ok' : 'c-danger') +
    kpi('#2563EB', 'Transaksi', UI.num(S.n), dN && dN.pct !== null ? (dN.up ? '▲ ' : '▼ ') + Math.abs(dN.pct) + '% vs ' + PREV[curRange] : 'jumlah pembeli') +
    kpi('#0EA5E9', 'Rata-rata belanja', UI.rp(S.n ? S.rev / S.n : 0), 'per transaksi') +
    kpi('#F59E0B', 'Barang terjual', UI.num(S.qty), 'unit');

  /* ---------- Untung dalam bahasa sehari-hari ---------- */
  var row = function (op, title, hint, val, cls, final) {
    return '<div class="r' + (final ? ' final' : '') + '"><span class="op ' + op + '">' + (op === 'plus' ? '+' : op === 'min' ? '−' : '=') + '</span>' +
      '<span class="t"><b>' + title + '</b><small>' + hint + '</small></span>' +
      '<span class="v ' + (cls || '') + '">' + UI.rp(val) + '</span></div>';
  };
  document.getElementById('pl').innerHTML = '<div class="rp-pl">' +
    row('plus', 'Uang masuk', 'total penjualan' + (S.disc ? ', sudah dipotong diskon ' + UI.rp(S.disc) : '') +
      (S.refund ? ', dikurangi refund ' + UI.rp(S.refund) : ''), S.rev) +
    row('min',  'Modal barang', 'harga beli barang yang terjual', S.hpp, 'c-mid') +
    row('min',  'Pengeluaran', 'sewa, gaji, listrik, dll', S.opex, 'c-mid') +
    row('min',  'Barang rusak', 'nilai modal barang yang rusak', S.loss, 'c-mid') +
    row('eq',   'Untung bersih', S.net >= 0 ? 'yang benar-benar Anda dapat' : 'periode ini masih rugi', S.net, S.net >= 0 ? 'c-ok' : 'c-danger', true) +
  '</div>';

  /* ---------- Grafik ---------- */
  drawChart(os);

  /* ---------- Produk paling laku (digabung per produk, termasuk varian add-on) ---------- */
  var agg = {};
  its.forEach(function (i) {
    var k = i.product_id || i.name;
    if (!agg[k]) {
      var p = products.find(function (x) { return x.id === i.product_id; });
      agg[k] = { name: p ? p.name : String(i.name || '').replace(/\s*\(\+.*\)$/, ''), qty: 0, rev: 0 };
    }
    agg[k].qty += Number(i.qty || 0);
    agg[k].rev += Number(i.subtotal || 0);
  });
  var top = Object.keys(agg).map(function (k) { return agg[k]; })
    .sort(function (a, b) { return b.qty - a.qty || b.rev - a.rev; }).slice(0, 6);
  var maxQ = top.length ? top[0].qty : 1;
  document.getElementById('top').innerHTML = top.length
    ? '<div class="rp-rank">' + top.map(function (t, idx) {
        return '<div class="it"><span class="no">' + (idx + 1) + '</span>' +
          '<div style="min-width:0"><div class="nm">' + UI.esc(t.name) + '</div>' +
          '<div class="meter"><i style="width:' + Math.max(4, t.qty / maxQ * 100).toFixed(1) + '%"></i></div></div>' +
          '<div class="val"><b>' + UI.num(t.qty) + ' terjual</b><small>' + UI.rp(t.rev) + '</small></div></div>';
      }).join('') + '</div>'
    : UI.empty('chart', 'Belum ada penjualan', 'Belum ada transaksi pada periode ini.');

  /* ---------- Cara bayar ---------- */
  var by = { cash: 0, qris: 0, transfer: 0 };
  os.forEach(function (o) { by[o.payment_method] = (by[o.payment_method] || 0) + Number(o.total || 0); });
  var PM = [['cash', 'Tunai', '#10B981'], ['qris', 'QRIS', '#7C3AED'], ['transfer', 'Transfer', '#0EA5E9']]
    .filter(function (m) { return m[0] !== 'transfer' || by.transfer; });
  var tot = S.rev || 1;
  document.getElementById('pay').innerHTML = S.rev
    ? '<div class="rp-split">' + PM.map(function (m) { return '<i style="width:' + (by[m[0]] / tot * 100) + '%;background:' + m[2] + '"></i>'; }).join('') + '</div>' +
      '<div class="rp-legend">' + PM.map(function (m) {
        return '<div class="l"><span class="rp-dot" style="background:' + m[2] + '"></span>' + m[1] +
          ' <span class="c-dim fs12">' + Math.round(by[m[0]] / tot * 100) + '%</span><b>' + UI.rp(by[m[0]]) + '</b></div>';
      }).join('') + '</div>'
    : '<div class="c-dim fs13">Belum ada pembayaran.</div>';

  /* ---------- Stok hampir habis ---------- */
  var low = products.filter(function (p) { return Number(p.stock) <= Number(p.min_stock || 0); })
    .sort(function (a, b) { return Number(a.stock) - Number(b.stock); }).slice(0, 6);
  document.getElementById('low').innerHTML = low.length
    ? '<div class="rp-low">' + low.map(function (p) {
        var st = Number(p.stock) || 0;
        return '<div class="it"><span>' + UI.esc(p.name) + '</span>' +
          '<span class="badge ' + (st <= 0 ? 'danger' : 'warn') + '">' + (st <= 0 ? 'Habis' : 'Sisa ' + UI.num(st)) + '</span></div>';
      }).join('') + '</div>'
    : '<div class="c-dim fs13">Semua stok aman.</div>';
}

/* ---------- Grafik batang dengan label sumbu ---------- */
function drawChart(os) {
  var r = UI.range(curRange);
  var byHour  = curRange === 'today' || curRange === 'yesterday';
  var byMonth = curRange === 'year';
  var n = byHour ? 24 : byMonth ? 12 : Math.max(1, Math.round((r[1] - r[0]) / 86400000));
  var MON = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];

  var buckets = new Array(n).fill(0);
  os.forEach(function (o) {
    var d = new Date(o.created_at), idx;
    if (byHour) idx = d.getHours();
    else if (byMonth) idx = d.getMonth();
    else idx = Math.floor((d - r[0]) / 86400000);
    if (idx >= 0 && idx < n) buckets[idx] += Number(o.total || 0);
  });

  /* Untuk jam: tampilkan jam buka saja (06–23) supaya batang tidak terlalu tipis */
  var from = 0, to = n;
  if (byHour) {
    var first = buckets.findIndex(function (v) { return v > 0; });
    var last = n - 1 - buckets.slice().reverse().findIndex(function (v) { return v > 0; });
    from = Math.min(first < 0 ? 7 : first, 7); to = Math.max(last < 0 ? 21 : last, 21) + 1;
  }

  var label = function (i) {
    if (byHour) return String(i).padStart(2, '0');
    if (byMonth) return MON[i];
    var d = new Date(r[0].getTime() + i * 86400000);
    return n > 7 ? String(d.getDate()) : d.toLocaleDateString('id-ID', { weekday: 'short' });
  };
  var full = function (i) {
    if (byHour) return String(i).padStart(2, '0') + ':00';
    if (byMonth) return MON[i];
    return new Date(r[0].getTime() + i * 86400000).toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });
  };

  var vis = buckets.slice(from, to);
  var max = Math.max.apply(null, vis.concat([0]));
  var peak = max > 0 ? vis.indexOf(max) : -1;
  var step = vis.length > 16 ? Math.ceil(vis.length / 8) : 1;

  document.getElementById('chartHint').textContent = max > 0
    ? (byHour ? 'Paling ramai jam ' : 'Paling ramai: ') + full(from + peak)
    : '';

  if (!max) {
    document.getElementById('chart').innerHTML = UI.empty('chart', 'Belum ada data', 'Grafik muncul setelah ada transaksi');
    return;
  }

  document.getElementById('chart').innerHTML =
    '<div class="rp-bars">' + vis.map(function (v, i) {
      var h = v / max * 100;
      return '<div class="rp-bar' + (v ? '' : ' zero') + (i === peak ? ' peak' : '') + '">' +
        '<span class="tip">' + full(from + i) + ' · ' + UI.rp(v) + '</span>' +
        '<i style="height:' + (v ? Math.max(h, 3) : 1.5).toFixed(1) + '%"></i></div>';
    }).join('') + '</div>' +
    '<div class="rp-x">' + vis.map(function (v, i) {
      return '<span>' + (i % step === 0 ? label(from + i) : '') + '</span>';
    }).join('') + '</div>';
}

/* ---------- Riwayat shift ---------- */
function renderShifts(list) {
  var card = document.getElementById('shiftCard');
  if (list === null) { card.classList.add('hide'); return; }
  document.getElementById('shiftRows').innerHTML = list.length ? list.map(function (x) {
    var open = !x.closed_at;
    var d = open ? null : Number(x.closing_cash) - Number(x.expected_cash);
    return '<tr><td class="fw6">' + UI.esc(x.user_name || '—') + '</td>' +
      '<td class="fs13 c-mid">' + UI.dt(x.opened_at) + (open ? ' · <span class="badge ok">masih buka</span>' : ' – ' + UI.dt(x.closed_at)) + '</td>' +
      '<td class="num mono">' + (open ? '—' : UI.rp(x.cash_sales)) + '</td>' +
      '<td class="num mono">' + (open ? '—' : UI.rp(x.qris_sales)) + '</td>' +
      '<td class="num mono">' + (open ? '—' : UI.rp(x.expected_cash)) + '</td>' +
      '<td class="num mono">' + (open ? '—' : UI.rp(x.closing_cash)) + '</td>' +
      '<td class="num mono fw7 ' + (d === null ? '' : d === 0 ? 'c-ok' : d > 0 ? 'c-warn' : 'c-danger') + '">' +
        (d === null ? '—' : (d > 0 ? '+' : d < 0 ? '−' : '') + UI.rp(Math.abs(d))) + '</td></tr>';
  }).join('') : '<tr><td colspan="7">' + UI.empty('clock', 'Belum ada shift') + '</td></tr>';
}

/* ---------- Pengeluaran ---------- */
function openExp() { renderExpList(); UI.openModal('mExp'); }

function renderExpList() {
  var exp = expenses.filter(function (e) { return inRange(e.created_at); });
  document.getElementById('expList').innerHTML = exp.length
    ? '<div class="label">PENGELUARAN PERIODE INI</div>' + exp.slice(0, 10).map(function (e) {
        return '<div class="row" style="padding:10px;border-radius:var(--r);background:var(--surface-2);margin-bottom:7px">' +
          '<div style="flex:1;min-width:0"><div class="fw7 fs13">' + UI.esc(e.category) + '</div>' +
          '<div class="fs12 c-dim">' + UI.esc(e.note || UI.dateOnly(e.created_at)) + '</div></div>' +
          '<span class="mono fw7">' + UI.rp(e.amount) + '</span>' +
          '<button class="btn btn-ghost btn-icon c-danger" onclick="delExp(\'' + e.id + '\')">' + UI.ic('trash',16) + '</button></div>';
      }).join('')
    : '';
}

async function saveExp() {
  var amt = Number(document.getElementById('xAmt').value) || 0;
  if (amt <= 0) return UI.toast('Jumlah harus lebih dari 0', 'error');

  UI.loading(true);
  var r = await API.from('expenses').insert({
    business_id: U.business_id,
    category: document.getElementById('xCat').value,
    amount: amt,
    note: document.getElementById('xNote').value.trim() || null,
    user_id: U.id,
  }).select('*').single();
  UI.loading(false);

  if (r.error) return UI.toast(r.error.message, 'error');
  document.getElementById('xAmt').value = '';
  document.getElementById('xNote').value = '';
  UI.toast('Pengeluaran dicatat', 'ok');
  await load();
  renderExpList();
}

function delExp(id) {
  UI.confirm({ title: 'Hapus pengeluaran?', text: 'Data akan dihapus permanen.', ok: 'Hapus', danger: true })
    .then(async function (ok) {
      if (!ok) return;
      UI.loading(true);
      await API.from('expenses').remove().eq('id', id).run();
      UI.loading(false);
      await load();
      renderExpList();
    });
}

/* ---------- Export CSV ---------- */
function exportCsv() {
  var os = orders.filter(function (o) { return inRange(o.created_at); });
  if (!os.length) return UI.toast('Tidak ada data untuk diexport', 'warn');

  var head = ['No Invoice', 'Tanggal', 'Kasir', 'Pembeli', 'Metode', 'Subtotal', 'Diskon', 'Pajak', 'Total', 'HPP', 'Laba'];
  var lines = [head.join(',')];

  os.forEach(function (o) {
    lines.push([
      o.order_no,
      new Date(o.created_at).toLocaleString('id-ID'),
      '"' + (o.cashier_name || '') + '"',
      '"' + (o.customer_name || '') + '"',
      o.payment_method,
      o.subtotal, o.discount, o.tax, o.total, o.cost_total,
      Number(o.total) - Number(o.cost_total),
    ].join(','));
  });

  var blob = new Blob(['﻿' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'laporan-stockflow-' + curRange + '-' + new Date().toISOString().slice(0, 10) + '.csv';
  a.click();
  URL.revokeObjectURL(a.href);
  UI.toast('CSV diunduh', 'ok');
}

load();
